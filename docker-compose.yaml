version: '3.8'

services:
  nginx-loadbalancer:
    image: nginx:latest
    container_name: nginx-loadbalancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

  app1:
    build:
      context: ./app
    container_name: app1
    expose:
      - "80"

  app2:
    build:
      context: ./app
    container_name: app2
    expose:
      - "80"

  app3:
    build:
      context: ./app
    container_name: app3
    expose:
      - "80"
